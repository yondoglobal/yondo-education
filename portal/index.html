:root {
  /* Yondo Education colours: logo teal and highlighter yellow, notebook paper, ballpoint blue */
  --teal: #0a6b63; --teal-700: #0d4a44; --deep: #0d4a44; --ink: #12302c; --ink-2: #46605c; --sand: #f4f8f7; --sand-2: #e3ebe9;
  --sage: #e2f1eb; --sage-2: #c4e0d5; --yellow: #ffd43b; --yellow-2: #e6b400; --coral: #ee8a8a; --coral-ink: #8a3a22; --white: #fff;
  --pen: #2443b0; --sky: #e8edfb; --sun: #fff3cc; --peach: #ffe2d4; --rule: #d5e2ef;
  --line: #d6e0de; --focus: #2443b0; --danger: #a12a1b; --warn-bg: #fff6d6; --ok: #1d6b3a;
  --radius: 18px; --radius-s: 12px; --shadow: 0 1px 2px rgba(18,48,44,.06), 0 10px 26px rgba(18,48,44,.09);
  --font: "Outfit", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Bengali", sans-serif;
  --hand: "Kalam", "Comic Neue", cursive;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--sand); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; }
img, svg { max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--teal); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 170px; }
.wrap.wide { max-width: 1080px; }
.topbar { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 56px; }
.topbar .logo { height: 30px; width: auto; }
.topbar .who { margin-left: auto; font-size: 14px; color: var(--ink-2); text-align: right; }
.menu-btn { border: 1px solid var(--line); background: var(--white); border-radius: 999px; padding: 8px 14px; min-height: 44px; cursor: pointer; }
.menu { position: absolute; right: 16px; top: 54px; background: var(--white); border-radius: var(--radius-s); box-shadow: var(--shadow); border: 1px solid var(--line); min-width: 230px; padding: 6px; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; border-radius: 10px; cursor: pointer; min-height: 44px; }
.menu button:hover { background: var(--sage); }

.preview-banner { background: var(--coral); color: #2b120a; text-align: center; font-size: 14px; padding: 6px 12px; font-weight: 600; }
.preview-tools { background: var(--ink); color: #fff; font-size: 13px; padding: 6px 12px; }
.preview-tools summary { cursor: pointer; font-weight: 700; padding: 4px 0; min-height: 32px; max-width: 1080px; margin: 0 auto; }
.preview-tools .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px auto 0; max-width: 1080px; }
.preview-tools button { background: #ffffff1f; color: #fff; border: 1px solid #ffffff40; border-radius: 999px; padding: 6px 10px; cursor: pointer; min-height: 36px; }
.preview-tools button[aria-pressed="true"] { background: var(--yellow); color: var(--ink); }

h1 { font-size: 30px; line-height: 1.15; margin: 20px 0 10px; letter-spacing: -.01em; }
h2 { font-size: 22px; line-height: 1.25; margin: 22px 0 8px; }
h3 { font-size: 18px; margin: 16px 0 6px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; font-weight: 600; color: var(--teal); margin-top: 26px; }
.lead { font-size: 18px; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }

.panel { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin: 14px 0; }
.panel > :first-child { margin-top: 0; }
.panel > :last-child { margin-bottom: 0; }
.panel.sage { background: var(--sage); box-shadow: none; }
.panel.note { background: var(--warn-bg); box-shadow: none; border: 1px solid #f0d58a; }
.panel.danger { background: #fde9e4; box-shadow: none; border: 1px solid #f2b6a6; }
.stack > * + * { margin-top: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: 999px; border: 2px solid transparent; cursor: pointer; font-weight: 700; text-decoration: none; }
.btn.primary { background: var(--yellow); color: var(--ink); box-shadow: 0 3px 0 var(--yellow-2); }
.btn.primary:hover { background: #ffdc5e; }
.btn.go { background: var(--yellow); color: var(--ink); box-shadow: 0 3px 0 var(--yellow-2); }
.btn.secondary { background: var(--white); color: var(--ink); border-color: var(--ink); }
.btn.ghost { background: transparent; color: var(--teal); padding: 10px 12px; }
.btn.warn { background: var(--white); color: var(--danger); border-color: var(--danger); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

/* gate */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background-color: #f7fafd;
  background-image: linear-gradient(to bottom, transparent 39px, var(--rule) 39px, var(--rule) 40px); background-size: 100% 40px; }
.gate::before { content: ""; position: fixed; top: 0; bottom: 0; left: 28px; width: 2px; background: var(--coral); opacity: .8; }
.gate .panel { max-width: 440px; width: 100%; padding: 28px 24px; }
.gate .logo { width: 210px; height: auto; display: block; margin: 0 auto 10px; }
label.fl { display: block; font-weight: 700; margin: 14px 0 6px; }
input.tx, textarea.tx { width: 100%; border: 2px solid var(--line); border-radius: var(--radius-s); background: #fff; padding: 12px 14px; min-height: 48px; }
textarea.tx { min-height: 110px; resize: vertical; line-height: 1.5; }
input.tx:focus, textarea.tx:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px #075e5a33; }
.tx[aria-invalid="true"] { border-color: var(--danger); }
.tx.muted-input { background: #f4f2ec; color: var(--ink-2); }

/* journey */
.milestones { display: flex; gap: 8px; margin: 8px 0 4px; flex-wrap: wrap; }
.milestones span { background: var(--white); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--teal); border: 1px solid var(--sage-2); }
.path { position: relative; margin-top: 10px; }
.path::before { content: ""; position: absolute; left: 31px; top: 30px; bottom: 30px; border-left: 3px dotted var(--sage-2); }
.stage-label { margin: 26px 0 6px 74px; font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--teal); text-transform: uppercase; }
.chapter { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; margin: 12px 0; }
.stone { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--white); border: 3px solid var(--sage-2); color: var(--teal); z-index: 1; }
.stone svg { width: 30px; height: 30px; }
.chapter.done .stone { background: var(--sage); border-color: var(--teal); }
.chapter.locked .stone { background: var(--sand-2); color: #8b8778; border-style: dashed; }
.chapter .panel { margin: 0; padding: 16px 18px; }
.chapter h3 { margin: 0 0 2px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--sand); color: var(--ink-2); border: 1px solid var(--line); }
.badge.ok { background: var(--sage); color: var(--teal); border-color: var(--sage-2); }
.badge.open { background: var(--warn-bg); color: #6b4b00; border-color: #f0d58a; }
.badge.lock { background: var(--sand-2); }
.badge.draft { background: #fff; color: var(--teal); border-color: var(--teal); }
.badge.test { background: var(--coral); color: #2b120a; border-color: var(--coral); }
.mini-dots { display: flex; gap: 4px; margin: 8px 0 2px; flex-wrap: wrap; }
.mini-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--sand-2); display: inline-block; }
.mini-dots i.on { background: var(--teal); }
.footer-note { text-align: center; color: var(--ink-2); font-size: 14px; margin: 30px 0; }

/* card player */
.player-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.dots button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--sage-2); background: var(--white); cursor: pointer; font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 0; }
.dots button.touched { background: var(--yellow); border-color: var(--yellow-2); color: var(--ink); }
.dots button[aria-current="step"] { background: var(--deep); color: #fff; border-color: var(--deep); box-shadow: 0 0 0 3px var(--sage-2); }
.qcard { background: var(--white); border-radius: 16px; box-shadow: var(--shadow); padding: 20px 20px 22px; margin-top: 10px; position: relative; overflow: hidden; border-top: 5px solid var(--coral); }
.qcard .cid { display: flex; gap: 8px; flex-wrap: wrap; min-height: 4px; }
.qcard h2 { margin-top: 2px; position: relative; z-index: 1; padding-right: 40px; }
.qcard .prompt { font-size: 18px; margin: 4px 0 14px; position: relative; z-index: 1; }
.field { border-top: 1px solid var(--sand-2); padding: 14px 0 10px; }
.field:first-of-type { border-top: 0; }
.field > .flabel { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 700; margin-bottom: 8px; }
.opt-tag { font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--sand); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; border: 0; padding: 0; margin: 0; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice span { display: inline-flex; align-items: center; min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--white); cursor: pointer; font-weight: 500; transition: transform .12s, border-color .12s, background .12s; }
.choice span:hover { border-color: var(--ink); transform: translateY(-1px); }
.choice input:checked + span { background: var(--deep); color: #fff; border-color: var(--deep); }
.choice input:checked + span::before { content: "✓"; margin-right: 6px; font-weight: 800; }
.choice input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice input:disabled + span { opacity: .45; cursor: not-allowed; }
.hint { font-size: 14px; color: var(--ink-2); background: var(--sand); border-radius: var(--radius-s); padding: 8px 12px; margin: 0 0 10px; }
.err { color: var(--danger); font-size: 14px; font-weight: 600; margin-top: 6px; }
.helper { font-size: 14px; color: var(--teal); margin-top: 4px; font-weight: 600; }
.counter { font-size: 12px; color: var(--ink-2); text-align: right; }
.status-toggle { background: none; border: 0; color: var(--teal); font-size: 14px; padding: 8px 0; cursor: pointer; text-decoration: underline; min-height: 40px; }
.status-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.status-chips button { border: 1.5px dashed var(--line); background: var(--sand); border-radius: 999px; padding: 6px 12px; min-height: 40px; cursor: pointer; font-size: 14px; }
.status-chips button[aria-pressed="true"] { border-style: solid; border-color: var(--teal); background: var(--sage); color: var(--teal); font-weight: 700; }
.marked { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; background: var(--sage); border-radius: var(--radius-s); padding: 8px 12px; margin-bottom: 8px; font-size: 15px; }
.marked button { margin-left: auto; }
.rows .row { border: 1.5px solid var(--sage-2); border-radius: var(--radius-s); padding: 6px 14px 10px; margin-bottom: 12px; background: #fcfbf7; }
.row-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--teal); }
.row .field { padding: 10px 0 6px; }
.card-status { margin-top: 14px; padding-top: 12px; border-top: 2px dotted var(--sand-2); }
.card-help { font-size: 14px; color: var(--ink-2); margin-top: 12px; }
.navbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); }
.navbar-in { max-width: 680px; margin: 0 auto; padding: 6px 12px calc(8px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: auto 1fr; grid-template-areas: "state state" "back actions"; gap: 4px 8px; align-items: center; }
.navbar .btn { min-height: 46px; padding: 8px 14px; }
.nav-back { grid-area: back; }
.nav-actions { grid-area: actions; justify-self: end; display: flex; gap: 6px; }
#savestate { grid-area: state; }
.savestate { font-size: 13px; color: var(--ink-2); text-align: center; line-height: 1.3; }
.savestate.bad { color: var(--danger); font-weight: 700; }
.savestate.good { color: var(--ok); }
.savestate button { font-size: 13px; }

/* review */
.qa { border-top: 1px solid var(--sand-2); padding: 10px 0; }
.qa .q { font-weight: 700; }
.qa .a { white-space: pre-wrap; overflow-wrap: anywhere; }
.qa .st { font-style: italic; color: var(--ink-2); }
.rowblock { border-left: 3px solid var(--sage-2); padding-left: 10px; margin: 6px 0; }
.receipt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--sage); padding: 2px 8px; border-radius: 8px; overflow-wrap: anywhere; }
.celebrate { width: 84px; height: 84px; margin: 10px auto 0; display: block; }
@media (prefers-reduced-motion: no-preference) {
  .celebrate .spark { animation: twinkle 1.6s ease-in-out infinite; transform-origin: center; }
  .celebrate .spark:nth-child(2) { animation-delay: .4s; } .celebrate .spark:nth-child(3) { animation-delay: .8s; }
  @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.05); } }
  .qcard { animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tile { text-align: left; background: var(--white); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; min-height: 44px; }
.tile[aria-pressed="true"] { border-color: var(--teal); background: var(--sage); }
.tile strong { display: block; margin-bottom: 4px; }

/* adviser */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 6px; }
.tabs button { border: 0; background: var(--white); border-radius: 999px; padding: 8px 16px; min-height: 44px; cursor: pointer; font-weight: 700; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--teal); color: #fff; }
table.grid { width: 100%; border-collapse: collapse; font-size: 15px; }
table.grid th, table.grid td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--sand-2); vertical-align: top; }
table.grid th { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.table-scroll { overflow-x: auto; }
.kv { display: grid; grid-template-columns: minmax(130px, 34%) 1fr; gap: 4px 12px; font-size: 15px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
select.tx { width: 100%; border: 2px solid var(--line); border-radius: var(--radius-s); background: #fff; padding: 10px 12px; min-height: 48px; }
details.guide { background: var(--warn-bg); border-radius: var(--radius-s); padding: 8px 12px; margin-top: 8px; font-size: 14px; }
details.guide pre { white-space: pre-wrap; font-family: inherit; margin: 6px 0 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; z-index: 60; font-size: 15px; max-width: calc(100vw - 32px); }
@media (max-width: 420px) {
  body { font-size: 16px; }
  h1 { font-size: 26px; }
  .qcard { padding: 18px 14px; }
  .navbar .btn { padding: 8px 10px; font-size: 15px; }
  .kv { grid-template-columns: 1fr; }
}

/* ------------------------------------------------------------ play */
.hello { font-family: var(--hand); color: var(--pen); font-size: 24px; margin: 22px 0 0; line-height: 1.3; }
h1 { letter-spacing: -.02em; }
.howplay { list-style: none; padding: 0; margin: 18px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; counter-reset: hp; }
.howplay li { background: var(--white); border-radius: var(--radius-s); padding: 14px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.howplay .num { width: 32px; height: 32px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; font-weight: 700; margin-bottom: 6px; }
.howplay strong { font-size: 17px; }
.howplay span:last-child { font-size: 14px; color: var(--ink-2); }
@media (max-width: 420px) { .howplay { grid-template-columns: 1fr; } }

.hero-card { background: var(--deep); color: #e3efec; border-radius: 22px; padding: 22px 22px 24px; margin-top: 18px; }
.hero-card h1 { color: #fff; margin-top: 4px; }
.hero-card .lead { color: #c3dcd5; }
.hero-card .hello { color: #bccbff; margin-top: 0; }
.hero-card .btn.go { margin-top: 16px; }
.hero-card :focus-visible { outline-color: var(--yellow); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0 12px; }
.stat { background: rgba(255,255,255,.08); border-radius: 14px; padding: 12px; display: grid; }
.stat strong { font-size: 26px; line-height: 1.1; color: var(--yellow); font-weight: 700; }
.stat span { font-size: 13px; color: #c3dcd5; }
.small-stats { max-width: 420px; margin: 16px auto; grid-template-columns: 1fr 1fr; }
.small-stats .stat { background: var(--white); box-shadow: var(--shadow); text-align: center; }
.small-stats .stat strong { color: var(--teal); }
.small-stats .stat span { color: var(--ink-2); }
.meter { height: 10px; border-radius: 999px; background: var(--sand-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--teal); transition: width .4s ease; }
.meter.big { height: 14px; background: rgba(255,255,255,.14); }
.meter.big i { background: var(--yellow); }
.sec-h { margin-top: 30px; }

.map { list-style: none; padding: 0; margin: 6px 0 0; position: relative; }
.map::before { content: ""; position: absolute; left: 31px; top: 30px; bottom: 30px; border-left: 3px dashed var(--sage-2); }
.stop { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; margin: 14px 0; }
.stop .stone { position: relative; }
.stop-n { position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 50%; background: var(--white); border: 2px solid var(--line); font-size: 12px; font-weight: 700; display: grid; place-items: center; color: var(--ink); }
.stop.done .stone { background: var(--yellow); border-color: var(--yellow-2); color: var(--ink); }
.stop.going .stone { border-color: var(--teal); border-style: solid; box-shadow: 0 0 0 5px var(--sage); }
.stop.is-next .panel { box-shadow: 0 0 0 2px var(--yellow), var(--shadow); }
.stop-meta { margin: 0; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.next-tag { background: var(--yellow); color: var(--ink); border-radius: 999px; padding: 1px 10px; font-weight: 700; font-size: 12px; }
.stop-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.wrap.wide .map, .wrap.wide .passport { max-width: 860px; }

.passport { list-style: none; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.stamp { text-align: center; padding: 12px 8px 14px; border-radius: 16px; background: var(--white); box-shadow: var(--shadow); }
.stamp .seal { position: relative; width: 84px; height: 84px; margin: 0 auto 8px; color: #9aaba8; }
.stamp .seal .ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.stamp .glyph { position: absolute; inset: 0; display: grid; place-items: center; }
.stamp .glyph svg { width: 30px; height: 30px; }
.stamp.got .seal { transform: rotate(-8deg); }
.stamp.got.sun .seal { color: #b88a00; background: radial-gradient(circle, var(--sun) 0 60%, transparent 61%); border-radius: 50%; }
.stamp.got.mint .seal { color: var(--teal); background: radial-gradient(circle, var(--sage) 0 60%, transparent 61%); border-radius: 50%; }
.stamp.got.sky .seal { color: var(--pen); background: radial-gradient(circle, var(--sky) 0 60%, transparent 61%); border-radius: 50%; }
.stamp.got.peach .seal { color: #b4482c; background: radial-gradient(circle, var(--peach) 0 60%, transparent 61%); border-radius: 50%; }
.stamp-t { font-weight: 700; margin: 0; font-size: 15px; }
.stamp-h { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.stamp:not(.got) .stamp-t { color: var(--ink-2); }
.stamp.big { box-shadow: none; background: transparent; }
.stamp.big .seal { width: 120px; height: 120px; }
.stamp.big .glyph svg { width: 44px; height: 44px; }

.player-progress { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin: 4px 0 2px; }
.clue-count { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.clue-count svg { width: 18px; height: 18px; color: var(--yellow-2); }
.clue-count .n { font-size: 18px; color: var(--ink); }
.kind-chip, .opt-chip { font-size: 12px; font-weight: 700; letter-spacing: .02em; border-radius: 999px; padding: 3px 10px; }
.kind-chip { background: var(--sky); color: var(--pen); }
.kind-puzzle .kind-chip { background: var(--sun); color: #6b4b00; }
.kind-mission .kind-chip { background: var(--peach); color: #8a3a22; }
.opt-chip { background: var(--sand); color: var(--ink-2); }
.kind-puzzle .qcard { border-top-color: var(--yellow-2); }
.kind-mission .qcard { border-top-color: var(--teal); }
.puzzle-hero { width: 76px; height: 76px; border-radius: 22px; background: var(--sun); display: grid; place-items: center; color: #6b4b00; margin-top: 18px; }
.puzzle-hero svg { width: 40px; height: 40px; }
.cheer { text-align: center; font-family: var(--hand); color: var(--pen); font-size: 26px; margin: 0 0 6px; }
.new-stamps { text-align: center; margin: 8px 0 4px; }
.new-stamps h2 { font-size: 20px; }
.stamp-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.tiles .tile { border-radius: 16px; transition: transform .12s, border-color .12s; }
.tiles .tile:hover { transform: translateY(-2px); border-color: var(--ink); }
.tile[aria-pressed="true"] { border-color: var(--deep); background: var(--sage); box-shadow: inset 0 0 0 1px var(--deep); }

.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.confetti i { position: absolute; top: -20px; left: var(--x); width: 9px; height: 14px; background: var(--c); border-radius: 2px; opacity: 0; transform: rotate(var(--r)) scale(var(--s)); }
@media (prefers-reduced-motion: no-preference) {
  .confetti i { animation: fall 1.8s cubic-bezier(.2,.6,.4,1) var(--d) forwards; }
  @keyframes fall { 0% { opacity: 1; transform: translateY(0) rotate(var(--r)) scale(var(--s)); } 100% { opacity: 0; transform: translateY(105vh) rotate(calc(var(--r) + 540deg)) scale(var(--s)); } }
  .clue-count.pop { animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .choice input:checked + span { animation: tap .22s ease; }
  @keyframes tap { 0% { transform: scale(.96); } 100% { transform: scale(1); } }
  .stamp.big .seal { animation: stampin .55s cubic-bezier(.2,.9,.3,1.3) both .2s; }
  @keyframes stampin { 0% { opacity: 0; transform: scale(1.8) rotate(-30deg); } 100% { opacity: 1; transform: scale(1) rotate(-8deg); } }
}
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } .meter i { transition: none; } .choice span, .tiles .tile { transition: none; } }
@media (max-width: 520px) {
  .stats { gap: 6px; } .stat { padding: 10px 8px; } .stat strong { font-size: 22px; } .stat span { font-size: 12px; }
  .passport { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.badge svg { width: 14px; height: 14px; flex: none; }
.stop .btn-row .btn { min-height: 44px; padding: 8px 16px; }
.stamp:not(.got) .glyph { opacity: .35; }
.journey-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px 32px; align-items: start; }
@media (min-width: 980px) {
  .journey-grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
  .passport-col { position: sticky; top: 76px; }
  .passport-col .passport { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .passport-col .stamp .seal { width: 64px; height: 64px; }
  .passport-col .stamp .glyph svg { width: 24px; height: 24px; }
  .passport-col .stamp-h { font-size: 12px; }
  .wrap.wide .map { max-width: none; }
}
.pick-count { font-weight: 700; color: var(--ink); background: var(--sun); border-radius: 999px; display: inline-block; padding: 6px 14px; margin: 6px 0 12px; }
.mission-ic { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--peach); color: #8a3a22; margin-bottom: 8px; }
.mission-ic svg { width: 20px; height: 20px; }
.tile[aria-pressed="true"] .mission-ic { background: var(--deep); color: #fff; }

/* ---------------------------------------------------------------- accounts (portal 2.1) */
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--sand); border-radius: 999px; padding: 4px; margin: 14px 0 8px; }
.auth-tabs button { border: 0; background: transparent; border-radius: 999px; min-height: 44px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.auth-tabs button[aria-selected="true"] { background: var(--deep); color: #fff; }
.auth-links { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 12px; }
.linkish { background: none; border: 0; color: var(--teal); text-decoration: underline; cursor: pointer; padding: 10px 6px; min-height: 44px; font-size: 15px; }
.field-wrap { margin-top: 2px; }
.steps-mini { padding-left: 22px; margin: 14px 0; }
.steps-mini li { margin: 6px 0; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 16px; }
.plain-fs { border: 0; padding: 0; margin: 12px 0 0; }
.plain-fs legend.fl { font-weight: 700; margin-bottom: 8px; }
.kv.compact { grid-template-columns: minmax(110px, 160px) 1fr; }
.req-tag { font-weight: 500; font-size: 13px; color: var(--coral-ink); background: var(--peach); border-radius: 999px; padding: 2px 8px; margin-left: 6px; }
.check-line { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 15px; }
.check-line input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--deep); }
.tiles.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin: 18px 0; }
.tiles.two .tile { min-height: 120px; padding: 18px 20px; font-size: 18px; }
.progress-steps { list-style: none; padding: 0; margin: 22px 0; display: grid; gap: 10px; counter-reset: ps; }
.progress-steps li { counter-increment: ps; display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center;
  background: var(--white); border-radius: var(--radius-s); padding: 12px 14px; box-shadow: var(--shadow); }
.progress-steps li::before { content: counter(ps); grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; background: var(--sand-2); color: var(--ink-2); }
.progress-steps li.done::before { content: "✓"; background: var(--deep); color: #fff; }
.progress-steps li.now::before { background: var(--yellow); color: var(--ink); }

<body>
<div id="app"><noscript><p style="padding:24px">Please turn on JavaScript to open your private discovery space.</p></noscript></div>
<script>(function(){'use strict';
/* Shared rules: the same semantics as db/02_logic.sql.
 * Used for inline guidance in the browser and by the synthetic preview backend.
 * The server re-validates everything; nothing here is trusted on its own. */

class ApiError extends Error {
  constructor(status, reason, detail, hint) { super(reason); this.status = status; this.reason = reason; this.detail = detail; this.hint = hint; }
}

const STATUSES = ['answered', 'unknown', 'not_tried', 'discuss_privately', 'skip_for_now'];
const OPEN_STATUSES = ['unknown', 'not_tried', 'discuss_privately', 'skip_for_now'];

function clone(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }
function isObj(x) { return x !== null && typeof x === 'object' && !Array.isArray(x); }
function jsonEq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function labelOf(f) { return f.label || f.id; }
function isBlankText(s) { return s == null || String(s).replace(/[\s ​]+/g, '') === ''; }

function fieldVisible(f, siblings) {
  if (!f.show_if) return true;
  const s = siblings && siblings[f.show_if.field];
  return !!(s && s.status === 'answered' && jsonEq(s.value, f.show_if.equals));
}

function cardTouched(ca) {
  return isObj(ca) && Object.values(ca).some(v => isObj(v) && v.status);
}

function verr(path, code, message) { return [{ path, code, message }]; }

function validateValue(f, v, path) {
  const lbl = labelOf(f);
  const empty = `“${lbl}” is marked as answered but is empty. Add your answer, or choose another option such as “Skip for now”.`;
  if (v === undefined || v === null) return verr(path, 'empty_answer', empty);
  switch (f.type) {
    case 'long_text': {
      if (typeof v !== 'string') return verr(path, 'bad_type', `“${lbl}” should be text.`);
      if (isBlankText(v)) return verr(path, 'empty_answer', empty);
      const max = f.max_length || 8000;
      if ([...v].length > max) return verr(path, 'too_long', `“${lbl}” is longer than ${max} characters. Please shorten it a little.`);
      return [];
    }
    case 'number': {
      if (typeof v !== 'number' || !isFinite(v)) return verr(path, 'not_a_number', `“${lbl}” needs a number.`);
      if (('min' in f && v < f.min) || ('max' in f && v > f.max))
        return verr(path, 'out_of_range', `“${lbl}” must be between ${f.min ?? '…'} and ${f.max ?? '…'}.`);
      if ('exclusiveMinimum' in f && v <= f.exclusiveMinimum)
        return verr(path, 'out_of_range', `“${lbl}” must be more than ${f.exclusiveMinimum}.`);
      if (f.integer && !Number.isInteger(v)) return verr(path, 'not_integer', `“${lbl}” needs a whole number.`);
      return [];
    }
    case 'single_select':
      if (typeof v !== 'string' || !f.choices.includes(v)) return verr(path, 'invalid_choice', `Please choose one of the listed options for “${lbl}”.`);
      return [];
    case 'multi_select':
      if (!Array.isArray(v) || v.length === 0) return verr(path, 'empty_answer', `Choose at least one option for “${lbl}”, or choose another status.`);
      if (v.some(x => typeof x !== 'string' || !f.choices.includes(x))) return verr(path, 'invalid_choice', `Please choose only the listed options for “${lbl}”.`);
      if (new Set(v).size !== v.length) return verr(path, 'duplicate_choice', `An option is repeated in “${lbl}”.`);
      if (f.max_selected && v.length > f.max_selected) return verr(path, 'too_many', `Choose up to ${f.max_selected} options for “${lbl}”.`);
      return [];
    default:
      return verr(path, 'bad_type', `Unsupported field type for “${lbl}”.`);
  }
}

function validateField(f, a, path, mode) {
  const lbl = labelOf(f);
  if (a === undefined || a === null || !isObj(a) || !a.status) {
    if (a !== undefined && a !== null && !isObj(a)) return verr(path, 'bad_shape', `“${lbl}” could not be read.`);
    if (mode === 'submit' && !f.optional)
      return verr(path, 'required', `“${lbl}” needs an answer — or choose “I don’t know yet”, “Skip for now” or another option.`);
    return [];
  }
  if (Object.keys(a).some(k => k !== 'status' && k !== 'value')) return verr(path, 'bad_shape', `“${lbl}” contains an unexpected property.`);
  if (!(f.allowed_statuses || STATUSES).includes(a.status)) return verr(path, 'invalid_status', `“${lbl}” has an option that is not allowed here.`);
  if (a.status !== 'answered') return [];
  if (f.type === 'repeat_group') {
    const rows = a.value;
    if (!Array.isArray(rows)) return verr(path, 'empty_answer', `“${lbl}” is marked as answered but has no rows.`);
    const min = f.min_items_if_answered ?? 1, max = f.max_items ?? 50;
    if (rows.length < min) return verr(path, 'too_few_rows', `“${lbl}” is marked as answered: add at least ${min} row, or choose another option.`);
    if (rows.length > max) return verr(path, 'too_many_rows', `“${lbl}” allows up to ${max} rows.`);
    let errs = [];
    rows.forEach((r, i) => {
      if (!isObj(r)) { errs = errs.concat(verr(`${path}[${i}]`, 'bad_shape', `Row ${i + 1} of “${lbl}” could not be read.`)); return; }
      Object.keys(r).forEach(k => { if (!f.fields.some(c => c.id === k)) errs = errs.concat(verr(`${path}[${i}].${k}`, 'unknown_field', 'An unexpected field was sent.')); });
      f.fields.forEach(ch => { if (fieldVisible(ch, r)) errs = errs.concat(validateField(ch, r[ch.id], `${path}[${i}].${ch.id}`, mode)); });
      if (r.earned?.status === 'answered' && r.maximum?.status === 'answered' && typeof r.earned.value === 'number'
          && typeof r.maximum.value === 'number' && r.result_format?.value === 'Marks out of maximum' && r.earned.value > r.maximum.value)
        errs = errs.concat(verr(`${path}[${i}].earned`, 'earned_exceeds_maximum', `Row ${i + 1}: marks earned are more than the maximum marks. Please check both numbers.`));
    });
    return errs;
  }
  return validateValue(f, a.value, path);
}

function validateMission(m, answers, mode) {
  if (!isObj(answers)) return verr('', 'bad_shape', 'The answers could not be read.');
  if (JSON.stringify(answers).length > 600000) return verr('', 'too_large', 'This chapter is too large to save in one go. Please shorten very long answers.');
  let errs = [];
  const selectable = !!(m.selection_rule && m.selection_rule.student_selects);
  Object.keys(answers).forEach(k => { if (!m.cards.some(c => c.id === k)) errs = errs.concat(verr(k, 'unknown_card', 'An answer was sent for a card that is not in this chapter.')); });
  for (const card of m.cards) {
    const ca = answers[card.id];
    if (ca !== undefined && !isObj(ca)) { errs = errs.concat(verr(card.id, 'bad_shape', 'A card could not be read.')); continue; }
    if (ca) Object.keys(ca).forEach(k => { if (!card.fields.some(x => x.id === k)) errs = errs.concat(verr(`${card.id}.${k}`, 'unknown_field', 'An unexpected field was sent.')); });
    const optional = card.optional_card || selectable;
    if (mode === 'submit' && optional && !cardTouched(ca)) continue;
    for (const f of card.fields) if (fieldVisible(f, ca || {})) errs = errs.concat(validateField(f, ca && ca[f.id], `${card.id}.${f.id}`, mode));
  }
  return errs;
}

function snapField(f, a, path) {
  if (!isObj(a) || !a.status) return { obj: null, open: [], priv: false };
  const o = { status: a.status };
  let open = [], priv = a.status === 'discuss_privately';
  if (a.status !== 'answered') open.push(path);
  else if (f.type === 'repeat_group') {
    o.value = a.value.map((r, i) => {
      const robj = {};
      for (const ch of f.fields) {
        if (!fieldVisible(ch, r)) { if (ch.id in r) robj[ch.id] = { status: 'skip_for_now', not_applicable: true }; continue; }
        const sub = snapField(ch, r[ch.id], `${path}[${i}].${ch.id}`);
        if (sub.obj) robj[ch.id] = sub.obj;
        open = open.concat(sub.open); priv = priv || sub.priv;
      }
      return robj;
    });
  } else o.value = clone(a.value);
  return { obj: o, open, priv };
}

function buildSnapshot(m, answers) {
  const out = [], questions = [], open = [], attempted = [];
  for (const card of m.cards) {
    const ca = answers[card.id];
    if (!cardTouched(ca)) continue;
    const fields = {}, qf = [];
    for (const f of card.fields) {
      qf.push(f.type === 'repeat_group' ? { id: f.id, label: f.label, type: f.type, fields: f.fields.map(c => ({ id: c.id, label: c.label, type: c.type })) }
                                        : { id: f.id, label: f.label, type: f.type });
      if (!fieldVisible(f, ca)) { fields[f.id] = { status: 'skip_for_now', not_applicable: true, visibility: 'adviser_only' }; continue; }
      const sub = snapField(f, ca[f.id], `${card.id}.${f.id}`);
      if (!sub.obj) continue;
      fields[f.id] = Object.assign(sub.obj, { visibility: 'adviser_only' });
      open.push(...sub.open);
    }
    out.push({ card_id: card.id, question_version: card.question_version, prompt_snapshot: card.prompt, fields });
    questions.push({ card_id: card.id, title: card.title, prompt: card.prompt, fields: qf });
    if (ca.response && ca.response.status === 'answered') attempted.push(card.id);
  }
  return { answers: out, questions, open_items: open, attempted };
}

function qualityFlags(answers) {
  const flags = [];
  const g = (c, f) => answers?.[c]?.[f];
  const c12 = g('SSTART03', 'class12_completion_year'), ey = g('SSTART03', 'entry_year');
  if (c12?.status === 'answered' && ey?.status === 'answered' && typeof c12.value === 'number' && typeof ey.value === 'number' && ey.value < c12.value)
    flags.push({ code: 'entry_year_before_completion', path: 'SSTART03.entry_year', message: 'The year you would like to start your next course is earlier than the year you finish school. Please check — your original entry is kept as typed.' });
  const ms = g('SSTART04', 'maths_status'), sj = g('SSTART04', 'subjects');
  if (ms?.status === 'answered' && sj?.status === 'answered' && Array.isArray(sj.value)) {
    const names = sj.value.map(r => r?.official_name?.value).filter(n => typeof n === 'string');
    const hasMath = names.some(n => /math/i.test(n)), hasApplied = names.some(n => /applied/i.test(n)), hasPlain = names.some(n => /math/i.test(n) && !/applied/i.test(n));
    const v = ms.value;
    if ((['Mathematics', 'Applied Mathematics', 'Both'].includes(v) && !hasMath) || (v === 'Neither' && hasMath)
        || (v === 'Mathematics' && hasApplied && !hasPlain) || (v === 'Applied Mathematics' && hasPlain && !hasApplied))
      flags.push({ code: 'maths_status_check', path: 'SSTART04.maths_status', message: 'The maths status and the subject list may not match. Your counsellor will check this with the school record.' });
  }
  const cm = g('PAR05', 'comfortable_annual_inr'), hd = g('PAR05', 'hard_annual_inr');
  if (cm?.status === 'answered' && hd?.status === 'answered' && typeof cm.value === 'number' && typeof hd.value === 'number' && hd.value < cm.value)
    flags.push({ code: 'budget_ceiling_below_comfortable', path: 'PAR05.hard_annual_inr', message: 'The hard annual ceiling is below the comfortable amount. Please clarify with the family; both values are kept.' });
  return flags;
}

/* Indian number formatting for rupee helper text: ₹2,50,000 = 2.5 lakh */
function formatINR(n) {
  try { return '₹' + new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 }).format(n); } catch (e) { return '₹' + n; }
}
function inrHelper(n) {
  if (typeof n !== 'number' || !isFinite(n)) return '';
  const lakh = n / 100000, crore = n / 10000000;
  const fmt = x => (Math.round(x * 100) / 100).toString();
  if (n >= 10000000) return `${formatINR(n)} = ${fmt(crore)} crore`;
  if (n >= 100000) return `${formatINR(n)} = ${fmt(lakh)} lakh`;
  return formatINR(n);
}

/* CSV that is safe to open in Excel/Sheets: formula-looking cells are prefixed,
 * quotes doubled. The JSON export keeps the untouched verbatim source. */
function csvCell(v) {
  let s = v == null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

/* Live API client: Supabase Auth (GoTrue) + PostgREST RPC. No SDK, no third-party scripts.
 * Only the public anon key is in the page; every permission is checked in Postgres.
 * Session tokens live in sessionStorage (cleared when the tab closes). Answers are never cached. */


function createLiveApi(cfg) {
  const SKEY = 'yondo_portal_session';
  let session = null;
  try { session = JSON.parse(sessionStorage.getItem(SKEY) || 'null'); } catch (e) { session = null; }

  function store(s) {
    session = s;
    try { s ? sessionStorage.setItem(SKEY, JSON.stringify(s)) : sessionStorage.removeItem(SKEY); } catch (e) { /* private mode */ }
  }

  async function authFetch(path, body, token) {
    let res;
    try {
      res = await fetch(cfg.supabaseUrl + '/auth/v1/' + path, {
        method: 'POST',
        headers: Object.assign({ 'apikey': cfg.anonKey, 'Content-Type': 'application/json' },
                               token ? { 'Authorization': 'Bearer ' + token } : {}),
        body: JSON.stringify(body || {})
      });
    } catch (e) { throw new ApiError(0, 'network'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new ApiError(res.status, data.error_code || data.error || data.msg || 'auth_failed', data, data.msg || data.error_description);
    return data;
  }

  function keep(data) {
    store({ access_token: data.access_token, refresh_token: data.refresh_token,
            expires_at: data.expires_at || (Math.floor(Date.now() / 1000) + (data.expires_in || 3600)) });
  }

  async function token() {
    if (!session) throw new ApiError(401, 'not_signed_in');
    if (session.expires_at - 60 < Date.now() / 1000) {
      try { keep(await authFetch('token?grant_type=refresh_token', { refresh_token: session.refresh_token })); }
      catch (e) { if (e.status !== 0) store(null); throw e.status === 0 ? e : new ApiError(401, 'session_ended'); }
    }
    return session.access_token;
  }

  // The student a counsellor or parent is working on. Students have one space, so it stays null for them.
  let currentCase = null;
  const withCase = (args) => (currentCase ? Object.assign({}, args, { p_case: currentCase }) : (args || {}));
  const redirectTo = () => location.origin + location.pathname;

  async function rpc(fn, args) {
    const t = await token();
    let res;
    try {
      res = await fetch(cfg.supabaseUrl + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: { 'apikey': cfg.anonKey, 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(args || {}),
        cache: 'no-store'
      });
    } catch (e) { throw new ApiError(0, 'network'); }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!res.ok) {
      let detail = data && data.details;
      try { detail = detail ? JSON.parse(detail) : detail; } catch (e) { /* plain text detail */ }
      if (res.status === 401) store(null);
      throw new ApiError(res.status, (data && data.message) || 'request_failed', detail, data && data.hint);
    }
    return data;
  }

  return {
    mode: 'live',
    hasSession: () => !!session,
    authMethods: cfg.authMethods || ['password'],
    async signInWithPassword(email, password) { keep(await authFetch('token?grant_type=password', { email, password })); },
    async signUp(email, password) {
      const d = await authFetch('signup?redirect_to=' + encodeURIComponent(redirectTo()), { email, password });
      if (d && d.access_token) { keep(d); return { session: true }; }
      return { session: false };
    },
    async resendConfirmation(email) { await authFetch('resend?redirect_to=' + encodeURIComponent(redirectTo()), { type: 'signup', email }); },
    async requestPasswordReset(email) { await authFetch('recover?redirect_to=' + encodeURIComponent(redirectTo()), { email }); },
    // Links in Yondo's emails come back here as #access_token=…&type=signup|recovery (or #error=…).
    consumeRedirect() {
      const raw = location.hash.replace(/^#/, '');
      if (!/(^|&)(access_token|error|error_code)=/.test(raw)) return null;
      const q = new URLSearchParams(raw);
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
      if (q.get('error') || q.get('error_code')) return { error: q.get('error_code') || q.get('error') };
      keep({ access_token: q.get('access_token'), refresh_token: q.get('refresh_token'),
             expires_at: Number(q.get('expires_at')) || null, expires_in: Number(q.get('expires_in')) || 3600 });
      return { type: q.get('type') || 'signup' };
    },
    setCase(id) { currentCase = id || null; },
    async sendCode(email) { await authFetch('otp', { email, create_user: !!cfg.createUserOnCode }); },
    async verifyCode(email, code) { keep(await authFetch('verify', { type: 'email', email, token: code })); },
    async changePassword(pw) {
      const t = await token();
      const res = await fetch(cfg.supabaseUrl + '/auth/v1/user', { method: 'PUT',
        headers: { 'apikey': cfg.anonKey, 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })
        .catch(() => { throw new ApiError(0, 'network'); });
      if (!res.ok) { const d = await res.json().catch(() => ({})); throw new ApiError(res.status, d.error_code || 'password_change_failed', d, d.msg); }
    },
    async signOut() {
      try { if (session) await authFetch('logout?scope=local', {}, session.access_token); } catch (e) { /* still clear locally */ }
      store(null);
    },
    me: () => rpc('portal_me'),
    recordConsent: (field, label) => rpc('portal_record_consent', { p_field: field, p_choice_label: label }),
    journey: () => rpc('portal_journey'),
    getDraft: (mission) => rpc('portal_get_draft', withCase({ p_mission: mission })),
    saveDraft: (mission, rev, answers) => rpc('portal_save_draft', withCase({ p_mission: mission, p_expected_revision: rev, p_answers: answers })),
    submit: (mission, requestId, rev) => rpc('portal_submit', withCase({ p_mission: mission, p_request_id: requestId, p_expected_revision: rev })),
    mySubmissions: () => rpc('portal_my_submissions'),
    adviserCase: () => rpc('portal_adviser_case', withCase({})),
    adviserSubmission: (r) => rpc('portal_adviser_submission', withCase({ p_receipt: r })),
    adviserExport: (includeTest) => rpc('portal_adviser_export', withCase({ p_include_test: includeTest })),
    adviserRecordConsent: (p, d, note, gName, gRel, gCh) => rpc('portal_adviser_record_consent', withCase(
      { p_purpose: p, p_decision: d, p_note: note, p_guardian_name: gName || null, p_guardian_relationship: gRel || null, p_guardian_channel: gCh || null })),
    adviserSetAssignment: (mission, state, reason) => rpc('portal_adviser_set_assignment', withCase({ p_mission: mission, p_state: state, p_reason: reason })),
    adviserAdaptFieldlab: (target, reason) => rpc('portal_adviser_adapt_fieldlab', withCase({ p_target: target, p_reason: reason })),
    adviserPrivateContent: () => rpc('portal_adviser_private_content', withCase({})),
    adviserAddNote: (type, receipt, body, kind) => rpc('portal_adviser_add_note', withCase({ p_record_type: type, p_related_receipt: receipt, p_body: body, p_interpretation_kind: kind })),
    adviserInviteParent: (email, name, rel) => rpc('portal_adviser_invite_parent', withCase({ p_email: email, p_name: name, p_relationship: rel || null })),
    adviserConfirmParentPermission: (note) => rpc('portal_adviser_confirm_parent_permission', withCase({ p_note: note || null })),
    // sign-up, Yondo team and parents
    register: (details) => rpc('portal_register', { p_details: details }),
    counsellorStudents: () => rpc('portal_counsellor_students'),
    adminOverview: () => rpc('portal_admin_overview'),
    adminAssign: (registration, counsellor) => rpc('portal_admin_assign', { p_registration: registration, p_counsellor: counsellor }),
    adminDecline: (registration, note) => rpc('portal_admin_decline', { p_registration: registration, p_note: note }),
    adminChangeCounsellor: (caseId, counsellor) => rpc('portal_admin_change_counsellor', { p_case: caseId, p_counsellor: counsellor }),
    adminSaveStaff: (email, name, isAdmin, isCounsellor, active) => rpc('portal_admin_save_staff',
      { p_email: email, p_display_name: name, p_is_admin: !!isAdmin, p_is_counsellor: !!isCounsellor, p_active: active !== false }),
    parentHome: () => rpc('portal_parent_home', withCase({})),
    parentPermission: (decision) => rpc('portal_parent_permission', withCase({ p_decision: decision }))
  };
}

/* Yondo private discovery portal · interface
 * Data-driven renderer for the canonical question bank. Answers are rendered as text only

async function openChapter(missionId, index) {
  let mission, draft;
  if (App.ed && App.ed.missionId === missionId) {
    const cards = playerCards();
    if (!cards.length) { location.hash = '#/fieldlab'; return; }
    App.ed.index = Math.max(0, Math.min(index || 0, cards.length - 1));
    return renderPlayer();
  }
  try {
    draft = await App.api.getDraft(missionId);
    mission = isFamilyEditor() ? draft.mission : App.missions[missionId];
  } catch (e) {
    if (e.reason === 'not_in_preview') return page([h('h1', null, 'Family record'), h('div', { class: 'panel note' }, h('p', null, e.hint))], { wide: true });
    return handleApiError(e);
  }
  if (!mission || !mission.cards) { location.hash = isFamilyEditor() ? familyHome() : '#/journey'; return; }
  if (!App.ed || App.ed.missionId !== missionId) {
    App.ed = { missionId, mission, caseId: App.caseId, answers: clone(draft.answers), confirmed: clone(draft.answers), revision: draft.revision,
      savedAt: draft.saved_at, state: draft.revision > 0 ? 'saved' : 'idle', timer: null, inFlight: null, conflict: null,
      invalid: {}, flags: draft.quality_flags || [], openStatus: {}, requestId: null, requestRev: null, introSeen: false };
  }
  const ed = App.ed;
  const cards = playerCards();
  if (!cards.length) { location.hash = '#/fieldlab'; return; }
  ed.index = Math.max(0, Math.min(index || 0, cards.length - 1));
  const isTask = ['student-skills-one', 'student-skills-two'].includes(missionId);
  if (isTask && !ed.introSeen && !Object.keys(ed.answers).length) return renderTaskIntro();
  renderPlayer();
}

function playerCards() {
  const ed = App.ed;

    const chosen = new Set([...Object.keys(ed.answers).filter(k => cardTouched(ed.answers[k])), ...App.fieldlabPick]);
    return ed.mission.cards.filter(c => chosen.has(c.id));

  return ed.mission.cards;

function rerenderCard(focusId) {

  slot.replaceChildren(renderCard(card));
  window.scrollTo(0, y);
  let el = focusId ? document.getElementById(focusId) : null;
  if (App.focusNext) { el = slot.querySelector(`[id^="${App.focusNext}"]`) || el; App.focusNext = null; }

      try { el.selectionStart = el.selectionEnd = el.value.length; } catch (e) { /* number inputs */ }
    }
  }

function updateCardFlags() {
  const box = document.getElementById('card-flags'); const ed = App.ed;
  if (!box || !ed) return;
  const card = playerCards()[ed.index];
  const flags = (ed.flags || []).filter(fl => fl.path.startsWith(card.id + '.'));
  const key = JSON.stringify(flags.map(f => f.code));
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.replaceChildren(...flags.map(fl => h('div', { class: 'panel note small', role: 'note' }, fl.message)));

function changed(structuralFocus) {
  const ed = App.ed;
  ed.flags = qualityFlags(ed.answers);
  updateCardFlags();
  if (ed.state !== 'conflict' && ed.state !== 'expired') ed.state = 'pending';
  updateSaveState();
  saveSoon(1000);
  noteClueProgress();
  if (structuralFocus) rerenderCard(structuralFocus === 'card' ? null : 'f-' + structuralFocus.replace(/[^A-Za-z0-9_-]/g, '_'));

// One field (also used for repeat-row children). get() returns {status,value}|undefined.
function fieldEl(f, path, get, set, siblings) {
  const C = App.C.card, ed = App.ed;
  const id = 'f-' + path.replace(/[^A-Za-z0-9_-]/g, '_');
  const a = get();
  const st = a && a.status;
  const errId = id + '-err';

  const marked = st && st !== 'answered';
  const allowed = (f.allowed_statuses || STATUSES).filter(s => s !== 'answered');
  const describedBy = errId;
  const setAnswered = (v) => set(v === undefined ? (marked ? { status: st } : undefined) : { status: 'answered', value: v });

  let control;
  if (f.type === 'long_text') {
    const max = f.max_length || 8000;
    const counter = h('div', { class: 'counter', 'aria-hidden': 'true' });

      oninput: () => {
        const v = ta.value;
        counter.textContent = v.length > max * 0.8 ? `${v.length} / ${max}` : '';
        if (isBlankText(v)) set(marked ? { status: st } : undefined);
        else set({ status: 'answered', value: v }, marked);
        ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 4, 480) + 'px';
      } });
    control = [ta, counter];
  } else if (f.type === 'number') {
    const isInr = /_inr$/.test(f.id);
    const inp = h('input', { class: 'tx' + (marked ? ' muted-input' : ''), id, type: 'text', inputmode: 'decimal', autocomplete: 'off', 'aria-describedby': describedBy,
      value: a && typeof a.value === 'number' ? String(a.value) : '',
      oninput: () => {
        const raw = inp.value.trim();
        delete ed.invalid[path]; errBox.textContent = ''; inp.removeAttribute('aria-invalid'); helperBox.textContent = '';
        if (raw === '') { set(marked ? { status: st } : undefined); updateSaveState(); return; }
        const cleaned = isInr ? raw.replace(/,/g, '') : raw;
        const n = /^-?\d+(\.\d+)?$/.test(cleaned) ? Number(cleaned) : NaN;
        const errs = isNaN(n) ? verr(path, 'not_a_number', `“${labelOf(f)}” needs a number (digits only).`) : validateValue(f, n, path);
        if (errs.length) { ed.invalid[path] = true; errBox.textContent = errs[0].message + ' Not saved until fixed.'; inp.setAttribute('aria-invalid', 'true'); updateSaveState(); return; }
        if (isInr) helperBox.textContent = inrHelper(n);
        set({ status: 'answered', value: n }, marked);
      } });
    if (isInr && a && typeof a.value === 'number') helperBox.textContent = inrHelper(a.value);
    control = [inp, isInr ? h('div', { class: 'small muted' }, 'Amount in rupees, typed in full (for example 250000). Not in lakh.') : null];
  } else if (f.type === 'single_select') {
    control = h('div', { class: 'choices', role: 'radiogroup', 'aria-labelledby': id + '-lbl', 'aria-describedby': describedBy }, f.choices.map((c, i) =>
      h('label', { class: 'choice' }, h('input', { type: 'radio', name: id, id: i === 0 ? id : null, value: c, checked: !marked && a && a.value === c,
        onchange: () => set({ status: 'answered', value: c }, true) }), h('span', null, c))));
  } else if (f.type === 'multi_select') {
    const cur = !marked && a && Array.isArray(a.value) ? a.value : [];
    const max = f.max_selected || f.choices.length;
    control = [h('div', { class: 'choices', role: 'group', 'aria-labelledby': id + '-lbl', 'aria-describedby': describedBy }, f.choices.map((c, i) =>
      h('label', { class: 'choice' }, h('input', { type: 'checkbox', id: i === 0 ? id : null, value: c, checked: cur.includes(c), disabled: !cur.includes(c) && cur.length >= max,
        onchange: (ev) => {
          const next = ev.target.checked ? f.choices.filter(x => cur.includes(x) || x === c) : cur.filter(x => x !== c);
          set(next.length ? { status: 'answered', value: next } : (marked ? { status: st } : undefined), true);
        } }), h('span', null, c)))),
      f.max_selected ? h('div', { class: 'small muted', style: 'margin-top:6px' }, `Choose up to ${f.max_selected}.`) : null];
  } else if (f.type === 'repeat_group') {
    control = repeatEl(f, path, a, set, marked, st);
  }

  const statusChips = h('div', { class: 'status-chips', hidden: !marked, id: id + '-chips' }, allowed.map(s =>
    h('button', { type: 'button', 'aria-pressed': String(st === s), onclick: () => {

function repeatEl(f, path, a, set, marked, st) {
  const C = App.C.card;
  const rows = a && Array.isArray(a.value) ? a.value : [];
  const max = f.max_items || 50;
  const commit = (newRows, structural) => set(newRows.length ? { status: marked ? st : 'answered', value: newRows } : (marked ? { status: st } : undefined), structural);
  return h('div', { class: 'rows' },
    rows.map((r, i) => h('div', { class: 'row', role: 'group', 'aria-label': `${labelOf(f)} ${i + 1}` },
      h('div', { class: 'row-head' }, h('span', null, `${labelOf(f)} · ${i + 1}`),
        (() => {
          const hasContent = Object.values(r).some(v => v && v.status);
          const btn = h('button', { type: 'button', class: 'btn ghost' }, C.remove_row);
          const go = () => commit(rows.filter((_, j) => j !== i), true);
          return hasContent ? twoStep(btn, 'Tap again to remove', go) : (btn.addEventListener('click', go), btn);
        })()),
      f.fields.filter(ch => fieldVisible(ch, r)).map(ch => fieldEl(ch, `${path}[${i}].${ch.id}`,
        () => r[ch.id],
        (val, structural) => {
          const copy = rows.map(x => x);
          const nr = Object.assign({}, r);
          if (val === undefined) delete nr[ch.id]; else nr[ch.id] = val;
          copy[i] = nr; commit(copy, structural);
        }, r)))),
    h('button', { type: 'button', class: 'btn secondary', disabled: rows.length >= max, onclick: () => {
      App.focusNext = 'f-' + `${path}[${rows.length}]`.replace(/[^A-Za-z0-9_-]/g, '_');
      commit(rows.concat([{}]), true);
    } },
      '+ ' + C.add_row),
    rows.length >= max ? h('p', { class: 'small muted' }, `Up to ${max} rows.`) : null);
}

// ------------------------------------------------------------------ saving (server-acknowledged only)
function hasUnconfirmed() {
  const ed = App.ed;
  return !!ed && (!jsonEq(ed.answers, ed.confirmed) || Object.keys(ed.invalid).length > 0 || ed.state === 'conflict');
}
function saveSoon(ms) {
  const ed = App.ed; if (!ed) return;
  clearTimeout(ed.timer);
  ed.timer = setTimeout(() => flushSave(), ms);
}
async function flushSave() {
  const ed = App.ed; if (!ed) return true;
  clearTimeout(ed.timer);
  if (ed.state === 'conflict' || ed.state === 'expired') { updateSaveState(); return false; }
  if (ed.inFlight) { await ed.inFlight; if (App.ed !== ed) return true; }
  if (jsonEq(ed.answers, ed.confirmed)) {
    if (ed.revision > 0 || Object.keys(ed.answers).length === 0) ed.state = ed.revision > 0 ? 'saved' : 'idle';
    updateSaveState(); return Object.keys(ed.invalid).length === 0;
  }
  const snapshot = clone(ed.answers);
  ed.state = 'saving'; updateSaveState();
  ed.inFlight = (async () => {
    try {
      const r = await App.api.saveDraft(ed.missionId, ed.revision, snapshot);
      ed.revision = r.revision; ed.confirmed = snapshot; ed.savedAt = r.saved_at; ed.flags = r.quality_flags || ed.flags;
      ed.state = jsonEq(ed.answers, ed.confirmed) ? 'saved' : 'pending';
      ed.lastError = null;
      return true;
    } catch (e) {
      if (e.status === 0) ed.state = 'offline';
      else if (e.status === 409) { ed.state = 'conflict'; ed.conflict = e.detail || {}; }
      else if (e.status === 401) ed.state = 'expired';
      else { ed.state = 'failed'; ed.lastError = e; }
      return false;
    } finally { ed.inFlight = null; }
  })();
  const ok = await ed.inFlight;
  updateSaveState();
  if (ok && ed.state === 'pending') return flushSave();
  return ok && Object.keys(ed.invalid).length === 0;
}

function updateSaveState() {
  const el = document.getElementById('savestate'); const ed = App.ed;
  if (!el || !ed) return;
  const S = App.C.save;
  const retry = h('button', { class: 'btn ghost', style: 'min-height:36px;padding:2px 8px', onclick: () => { if (ed.state !== 'conflict') { ed.state = 'pending'; flushSave(); } } }, 'Retry');
  el.className = 'savestate';
  let kids;
  switch (ed.state) {
    case 'saving': kids = [S.saving]; break;
    case 'saved': kids = [fill(S.saved, { local_time: localTime(ed.savedAt) })]; el.classList.add('good'); break;
    case 'pending': kids = [S.pending]; break;
    case 'offline': kids = [S.offline, ' ', retry]; el.classList.add('bad'); break;
    case 'failed': kids = [S.failed, ' ', retry, ed.lastError && ed.lastError.detail && ed.lastError.detail.errors ? h('div', null, ed.lastError.detail.errors[0].message) : null]; el.classList.add('bad'); break;
    case 'conflict': kids = [S.conflict, ' ', h('button', { class: 'btn ghost', style: 'min-height:36px;padding:2px 8px', onclick: renderConflict }, 'Review both')]; el.classList.add('bad'); break;
    case 'expired': kids = [S.expired, ' ', h('button', { class: 'btn ghost', style: 'min-height:36px;padding:2px 8px', onclick: () => { App.ed = null; renderGate('expired_session'); } }, 'Sign in')]; el.classList.add('bad'); break;
    default: kids = ['Answers are saved to your private record as you go.'];
  }
  if (Object.keys(ed.invalid).length && ed.state !== 'conflict') { kids.push(h('div', null, 'One answer is not saved yet: fix the highlighted number.')); el.classList.add('bad'); }
  el.replaceChildren(...kids);
}

// ------------------------------------------------------------------ answers as text
function answerLine(f, a) {
  if (!a) return null;
  if (a.not_applicable) return h('div', { class: 'qa' }, h('div', { class: 'q' }, labelOf(f)), h('div', { class: 'st' }, 'Not shown for this answer'));
  if (a.status !== 'answered') return h('div', { class: 'qa' }, h('div', { class: 'q' }, labelOf(f)), h('div', { class: 'st' }, statusText(a.status), ' · open question'));
  let val;

function flatAnswers(a, q, prefix, out) {
  (q.fields || []).forEach(f => {
    const v = a[f.id]; if (!v) return;
    if (f.type === 'repeat_group' && v.status === 'answered') (v.value || []).forEach((r, i) => flatAnswers(r, f, `${prefix}${f.id}[${i + 1}].`, out));
    else out.push({ field: prefix + f.id, label: f.label, status: v.not_applicable ? 'not_applicable' : v.status,
      value: v.status === 'answered' ? (Array.isArray(v.value) ? v.value.join(' | ') : v.value) : '' });
  });
  return out;
}
function toCsv(x) {
  const head = ['receipt', 'revision', 'submitted_at_utc', 'source_role', 'chapter', 'card_id', 'card_title', 'prompt', 'field', 'field_label', 'status', 'answer_verbatim'];
  const lines = [head.map(csvCell).join(',')];
  x.submissions.forEach(s => s.envelope.answers.forEach(a => {
    const q = s.questions.find(y => y.card_id === a.card_id) || {};
    const rows = flatAnswers(a.fields, q, '', []);
    rows.forEach(r => lines.push([s.envelope.receipt, s.envelope.revision, s.envelope.submitted_at, s.envelope.source_role, s.envelope.mission_id,
      a.card_id, q.title, a.prompt_snapshot, r.field, r.label, r.status, r.value].map(csvCell).join(',')));
  }));
  return '﻿' + lines.join('\r\n');
}
function humanCopy(s, tz) {
  const e = s.envelope, L = [];
  L.push(`Case: ${e.case_id}`, `Chapter: ${e.mission_id}`, `Receipt: ${e.receipt}`, `Revision: ${e.revision}${e.supersedes_receipt ? ' (updates ' + e.supersedes_receipt + ')' : ''}`,
    `Submitted: ${zonedDateTime(e.submitted_at, tz)} · ${e.submitted_at} UTC`, `Source role: ${e.source_role}`, `Content version: ${e.content_version}`,
    `Permission: participation valid at submission = ${e.consent_snapshot.participation_valid ? 'yes' : 'no'}; re-check current permission before any sharing`, e.is_test ? 'SYNTHETIC TEST RECORD' : '', '');
  e.answers.forEach(a => {
    const q = s.questions.find(x => x.card_id === a.card_id) || {};
    L.push(`[${a.card_id}] ${q.title || ''}`, `Q: ${a.prompt_snapshot}`);
    flatAnswers(a.fields, q, '', []).forEach(r => L.push(`  - ${r.label} (${r.field}): ${r.status === 'answered' ? r.value : '[' + r.status + ']'}`));
    L.push('');
  });
  L.push('Open questions:', ...(e.open_items.length ? e.open_items.map(o => '  - ' + o) : ['  (none)']));
  if ((s.quality_flags || []).length) L.push('', 'Clarification prompts:', ...s.quality_flags.map(f => '  - ' + f.message));
  L.push('', 'No rubric, score or career conclusion is included in this copy.');
  return L.filter(x => x !== null).join('\n');
}

// ------------------------------------------------------------------ play: map, passport, clues and celebrations
// Everything here is derived from progress the server already returns (journey states and touched cards).
// Stamps reward showing up and exploring. They are never scores, ranks or labels about the student.
const SENT_STATES = ['submitted', 'revised', 'submitted_with_open_items'];
function isSent(m) { return !!m && SENT_STATES.includes(m.status.state); }
function journeyMissions() { return (App.journey && App.journey.missions) || []; }
function missionInJourney(id) { return journeyMissions().find(m => m.id === id); }
function cluesIn(m) { return ((m && m.status && m.status.touched_cards) || []).length; }
function clueTotals() {
  const ms = journeyMissions(), open = ms.filter(m => m.status.access === 'available');
  return { clues: ms.reduce((n, m) => n + cluesIn(m), 0), cards: open.reduce((n, m) => n + (m.card_count || 0), 0),
           sent: ms.filter(isSent).length, chapters: open.length };
}
const STAMPS = [
  { id: 'first', title: 'First clue', how: () => 'Answer or mark your first card.', tone: 'sun', glyph: 'spark', earned: t => t.clues >= 1 },
  { id: 'launch', mission: 'student-start', title: 'Launchpad', tone: 'mint', glyph: 'start' },
  { id: 'clues', mission: 'student-discover', title: 'Clue collector', tone: 'sky', glyph: 'discover' },
  { id: 'learn', mission: 'student-academics', title: 'Learning story', tone: 'peach', glyph: 'academics' },
  { id: 'place', mission: 'student-places', title: 'Place finder', tone: 'mint', glyph: 'places' },
  { id: 'ten', title: 'Ten clues', how: () => 'Collect ten clues.', tone: 'sun', glyph: 'spark', earned: t => t.clues >= 10 },
  { id: 'puzzle', mission: 'student-skills-one', title: 'Puzzle solver', tone: 'sky', glyph: 'skills' },
  { id: 'worlds', title: 'Two worlds', how: () => 'Try two different kinds of work.', tone: 'peach', glyph: 'fieldlab',
    earned: () => { const f = App.journey && App.journey.fieldlab; return !!f && f.distinct_attempts.length >= f.target; } },
  { id: 'honest', title: 'Honest explorer', how: () => 'Send a chapter with an honest “I don’t know yet” in it.', tone: 'sun', glyph: 'onet',
    earned: () => journeyMissions().some(m => m.status.state === 'submitted_with_open_items') },
  { id: 'thirty', title: 'Thirty clues', how: () => 'Collect thirty clues.', tone: 'mint', glyph: 'spark', earned: t => t.clues >= 30 },
  { id: 'reality', mission: 'student-reality', title: 'Reality check', tone: 'sky', glyph: 'reality' },
  { id: 'map', mission: 'student-review', title: 'Map maker', tone: 'peach', glyph: 'review' }
];
function visibleStamps() { return STAMPS.filter(s => !s.mission || missionInJourney(s.mission)); }
function stampHow(s) { if (s.how) return s.how(); const m = missionInJourney(s.mission); return `Send “${m ? m.title : s.title}”.`; }
function earnedStamps() {
  const t = clueTotals(), out = new Set();
  visibleStamps().forEach(s => { if (s.mission ? isSent(missionInJourney(s.mission)) : s.earned(t)) out.add(s.id); });
  return out;
}
const STAMP_GLYPH = { spark: '<path d="M12 3l2.2 5.8L20 10l-4.6 3.7L17 20l-5-3.4L7 20l1.6-6.3L4 10l5.8-1.2z"/>' };
function stampEl(s, got, big) {
  const glyph = STAMP_GLYPH[s.glyph] ? `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${STAMP_GLYPH[s.glyph]}</svg>` : ICONS[s.glyph];
  const t = document.createElement('template');
  t.innerHTML = `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="${got ? '0' : '5 6'}"/><circle cx="50" cy="50" r="39" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/></svg>`;
  const g = document.createElement('template'); g.innerHTML = glyph;
  return h(big ? 'div' : 'li', { class: 'stamp ' + s.tone + (got ? ' got' : '') + (big ? ' big' : '') },
    h('div', { class: 'seal' }, t.content.firstChild, h('span', { class: 'glyph' }, g.content.firstChild)),
    h('p', { class: 'stamp-t' }, s.title),
    h('p', { class: 'stamp-h' }, got ? 'Earned' : stampHow(s)));
}
function meter(fraction, label, cls) {
  const pct = Math.max(0, Math.min(100, Math.round((fraction || 0) * 100)));
  return h('div', { class: 'meter' + (cls ? ' ' + cls : ''), role: 'img', 'aria-label': label }, h('i', { style: `width:${pct}%` }));
}
function nextStop() {
  return journeyMissions().find(m => m.status.access === 'available' && !isSent(m) && !['locked', 'not_assigned'].includes(m.status.state));
}
function stopHref(m) { return m.id === 'student-fieldlab' ? '#/fieldlab' : `#/chapter/${m.id}/${firstOpenIndex(m)}`; }
function chapterKind(missionId) {
  return ['student-skills-one', 'student-skills-two'].includes(missionId) ? 'puzzle' : missionId === 'student-fieldlab' ? 'mission' : 'clue';
}
const KIND_LABEL = { puzzle: 'Puzzle', mission: 'Mission', clue: 'Clue card' };
function cardsTouchedNow() { const ed = App.ed; return ed ? playerCards().filter(c => cardTouched(ed.answers[c.id])).length : 0; }
// Called after every change on a card: when a card becomes answered or marked, the clue counter pops.
function noteClueProgress() {
  const ed = App.ed, box = document.getElementById('cluecount');
  if (!ed || !box || App.me.role !== 'student') return;
  const n = cardsTouchedNow(), prev = ed.cluesShown == null ? n : ed.cluesShown;
  ed.cluesShown = n;
  const num = box.querySelector('.n'); if (num) num.textContent = String(n);
  const bar = document.querySelector('.player-meter i'); if (bar) bar.style.width = Math.round(100 * n / Math.max(1, playerCards().length)) + '%';
  if (n > prev) {
    box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    const live = document.getElementById('clue-live'); if (live) live.textContent = `Clue saved. ${n} of ${playerCards().length} in this chapter.`;
  }
}
function confetti() {
  const colors = ['#ffd43b', '#0a6b63', '#2443b0', '#ee8a8a', '#e2f1eb', '#e6b400'];
